<!DOCTYPE html>
<html>
  <head>
    <style>
        #two {
            display:none;
        }
    </style>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title> JavaScript </title>
    <script>

    function mouseclick(letter) {
    document.getElementById(letter).style.color = "green";
    }

    function showwooden() {
        document.getElementById("two").style.display = "block"
        document.getElementById("one").style.display = "none"
    }

    function showcloth() {
        document.getElementById("two").style.display = "none"
        document.getElementById("one").style.display = "block"
    }
    </script>
  </head>
  <div id="one">
  <img
    class="button"
    src="bed1.jpg"
    onclick="showwooden()"
    />
  <h2>This is a wooden bed</h2>
</div>
<div id="two">
    <img
    class="button"
    src="bed2.jpg"
    onclick="showcloth()"
    />

  <h2>This is a cloth bed</h2>
</div>
  <body>

  </body>

</html>
