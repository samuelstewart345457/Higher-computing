<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>N5 - WDD - Lesson 9 Example</title>
    <script>
      function mouseOver(letter) {
        document.getElementById(letter).style.color = "red";
      }
      function mouseOut(letter) {
        document.getElementById(letter).style.color = "black";
      }
    </script>

    <!-- *********************************************************************************************** -->
    <!-- Task 2: Add functionality so that when Welcome is clicked, the word changes to the colour green -->
    <!-- *********************************************************************************************** -->
  </head>

  <body>
    <h1 id="S" onmouseover="mouseOver('S')" onmouseout="mouseOut('S')">S</h1>
    <h1 id="A" onmouseover="mouseOver('A')" onmouseout="mouseOut('A')">A</h1>
    <h1 id="M" onmouseover="mouseOver('M')" onmouseout="mouseOut('M')">M</h1>
    <h1 id="U" onmouseover="mouseOver('U')" onmouseout="mouseOut('U')">U</h1>
    <h1 id="E" onmouseover="mouseOver('E')" onmouseout="mouseOut('E')">E</h1>
    <h1 id="L" onmouseover="mouseOver('L')" onmouseout="mouseOut('L')">L</h1>
  </body>
</html>
